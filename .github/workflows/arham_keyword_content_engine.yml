name: Arham Keyword Blog & Collection Engine

# Continuous cadence — no end date:
#   - 3 blogs every day (random IST publish times)
#   - 2 collection pages every week (Monday IST)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collections | blogs | both"
        required: true
        default: both
        type: choice
        options:
          - both
          - blogs
          - collections
      limit:
        description: "Blogs to create this run (daily cadence = 3)"
        required: false
        default: "3"
      collection_limit:
        description: "New collections this run (weekly cadence = 2)"
        required: false
        default: "2"
  schedule:
    # Daily 02:20 IST (20:50 UTC) — create next day's 3 blogs
    - cron: "50 20 * * *"
    # Monday 02:20 IST (Sunday 20:50 UTC) — also create 2 collections
    # (daily cron already fires; job detects weekday for collections)

jobs:
  fill-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Evergreen publish (no end date)
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: "https://divyaprabhafoods.myshopify.com"
          SHOPIFY_BLOG_ID: "97942077654"
        run: |
          set -e
          MODE="${{ github.event.inputs.mode || '' }}"
          LIMIT="${{ github.event.inputs.limit || '3' }}"
          COL_LIMIT="${{ github.event.inputs.collection_limit || '2' }}"
          # UTC weekday: 7 = Sunday => Monday morning IST for 20:50 UTC cron
          DOW="$(date -u +%u)"
          if [ -z "$MODE" ]; then
            if [ "$DOW" = "7" ]; then
              MODE="both"
            else
              MODE="blogs"
            fi
          fi
          echo "Mode=$MODE BlogLimit=$LIMIT CollectionLimit=$COL_LIMIT DOW=$DOW (evergreen, no end date)"
          if [ "$MODE" = "blogs" ] || [ "$MODE" = "both" ]; then
            python3 scratch/arham_keyword_content_engine.py --blogs --ongoing --limit "$LIMIT" --start-offset-days 1
          fi
          if [ "$MODE" = "collections" ] || [ "$MODE" = "both" ]; then
            python3 scratch/arham_keyword_content_engine.py --collections --ongoing --collection-limit "$COL_LIMIT"
          fi
