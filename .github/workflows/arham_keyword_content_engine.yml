name: Arham Keyword Blog & Collection Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collections | blogs | both"
        required: true
        default: both
        type: choice
        options:
          - both
          - blogs
          - collections
      limit:
        description: "Blog batch size (ignored if all=true)"
        required: false
        default: "30"
      all:
        description: "Process full remaining blog backlog"
        required: false
        default: false
        type: boolean
  schedule:
    # Keep filling remaining backlog daily at 02:20 IST (20:50 UTC)
    - cron: "50 20 * * *"

jobs:
  fill-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Publish collections + scheduled blogs from ready queues
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: "https://divyaprabhafoods.myshopify.com"
          SHOPIFY_BLOG_ID: "97942077654"
        run: |
          set -e
          MODE="${{ github.event.inputs.mode || 'both' }}"
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          ALL="${{ github.event.inputs.all || false }}"
          echo "Mode=$MODE Limit=$LIMIT All=$ALL"
          if [ "$MODE" = "collections" ] || [ "$MODE" = "both" ]; then
            python3 scratch/publish_arham_ready_queues.py --collections
          fi
          if [ "$MODE" = "blogs" ] || [ "$MODE" = "both" ]; then
            if [ "$ALL" = "true" ]; then
              python3 scratch/publish_arham_ready_queues.py --blogs --all
            else
              python3 scratch/publish_arham_ready_queues.py --blogs --limit "$LIMIT"
            fi
          fi
