name: Blog Featured Image Backfill

# Replaces the repeated product-photo featured image on existing posts with a unique
# generated one, 15 posts per day (newest first). Stops touching posts once all are done.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Posts to update this run"
        required: false
        default: "15"
  schedule:
    # 00:45 UTC = 06:15 IST, before the first blog slot
    - cron: "45 0 * * *"

concurrency:
  group: arham-content-engine
  cancel-in-progress: false

jobs:
  backfill-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install image tools
        run: pip install --quiet pillow
      - name: Backfill featured images
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: "https://divyaprabhafoods.myshopify.com"
          SHOPIFY_BLOG_ID: "97942077654"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "83ba121b9af45ca6b1a485bb22cc43a1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scratch/backfill_blog_images.py --limit "${{ github.event.inputs.limit || '15' }}"
