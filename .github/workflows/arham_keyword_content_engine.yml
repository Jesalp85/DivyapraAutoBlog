name: Arham Keyword Blog & Collection Engine

# Continuous cadence — no end date:
#   - 3 blogs every day, one per IST slot (the script publishes only what is due)
#   - 2 collection pages every IST week (the script counts what already exists)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collections | blogs | both"
        required: true
        default: both
        type: choice
        options:
          - both
          - blogs
          - collections
      limit:
        description: "Blogs per day"
        required: false
        default: "3"
      collection_limit:
        description: "New collections per week"
        required: false
        default: "2"
  schedule:
    # 03:35, 08:35, 13:35 UTC = 09:05, 14:05, 19:05 IST (one run per blog slot)
    - cron: "35 3,8,13 * * *"

concurrency:
  group: arham-content-engine
  cancel-in-progress: false

jobs:
  fill-content:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install image tools
        run: pip install --quiet pillow numpy
      - name: Randomise publish time
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 2400))
      - name: Evergreen publish (no end date)
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: "https://divyaprabhafoods.myshopify.com"
          SHOPIFY_BLOG_ID: "97942077654"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "83ba121b9af45ca6b1a485bb22cc43a1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          MODE="${{ github.event.inputs.mode || 'both' }}"
          LIMIT="${{ github.event.inputs.limit || '3' }}"
          COL_LIMIT="${{ github.event.inputs.collection_limit || '2' }}"
          echo "Mode=$MODE BlogsPerDay=$LIMIT CollectionsPerWeek=$COL_LIMIT"
          if [ "$MODE" = "blogs" ] || [ "$MODE" = "both" ]; then
            python3 scratch/arham_keyword_content_engine.py --blogs --ongoing --limit "$LIMIT"
          fi
          if [ "$MODE" = "collections" ] || [ "$MODE" = "both" ]; then
            python3 scratch/arham_keyword_content_engine.py --collections --ongoing --collection-limit "$COL_LIMIT"
          fi
